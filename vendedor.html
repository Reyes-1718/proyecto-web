<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSP: restringe orígenes de scripts, estilos y conexiones para mitigar XSS.
       Incluye los orígenes del login con Google (popup + iframe de Firebase Auth). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://rifa-digital-85131.firebaseapp.com https://accounts.google.com https://apis.google.com; base-uri 'self'; object-src 'none'; form-action 'self'">
  <title>Portal Vendedor — Rifa 2025</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Josefin+Sans:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/vendedor.css">
</head>
<body>

  <!-- ── Login ── -->
  <section id="login-section" class="login-section">
    <div class="login-card">
      <p class="login-pretitle">Portal de Vendedores</p>
      <h1 class="login-title">Acceso Vendedor</h1>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required maxlength="254"
            placeholder="vendedor@ejemplo.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required minlength="6" maxlength="128"
            placeholder="••••••••" autocomplete="current-password">
        </div>
        <p class="login-error" id="login-error" role="alert"></p>
        <button type="submit" class="btn-primary">Ingresar</button>
      </form>

      <div class="login-divider"><span>o</span></div>

      <!-- Login con Google: si la cuenta aún no es vendedor, queda como solicitud pendiente. -->
      <button type="button" id="btn-google" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.34A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.98 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.02-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.42 0 9 0A9 9 0 0 0 .96 4.94l3.02 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Continuar con Google
      </button>

      <a href="index.html" class="back-link">← Volver al sorteo</a>
    </div>
  </section>

  <!-- ── Panel vendedor ── -->
  <section id="vendedor-section" class="admin-section hidden">

    <header class="admin-header">
      <div>
        <h1 class="admin-title" id="v-nombre-display">Panel Vendedor</h1>
        <p class="admin-subtitle">Rifa Digital 2025</p>
      </div>
      <div class="admin-header-right">
        <span class="inactividad-badge">Sesión activa</span>
        <a href="index.html" class="btn-ghost" target="_blank" rel="noopener noreferrer">Ver grilla pública</a>
        <button id="logout-btn" class="btn-ghost danger">Cerrar sesión</button>
      </div>
    </header>

    <main class="admin-main">

      <!-- Stats del vendedor -->
      <div class="admin-stats">
        <div class="admin-stat-card highlight">
          <span class="admin-stat-value" id="v-stats-pendientes">—</span>
          <span class="admin-stat-label">Pendientes</span>
        </div>
        <div class="admin-stat-card">
          <span class="admin-stat-value" id="v-stats-vendidos">—</span>
          <span class="admin-stat-label">Vendidos</span>
        </div>
        <div class="admin-stat-card" id="card-ganancias">
          <span class="admin-stat-value" id="v-stats-ganancias">—</span>
          <span class="admin-stat-label">Mi ganancia</span>
        </div>
      </div>

      <!-- Reservar número -->
      <div class="admin-buscador">
        <h2 class="section-title">Reservar número</h2>
        <input type="number" id="v-buscar-numero" class="buscar-input"
          placeholder="Ingresá el número del boleto" min="1" max="99999">
        <div id="v-resultado" class="resultado-busqueda"></div>
      </div>

      <!-- Mis boletos -->
      <div class="admin-buscador v-mis-boletos-section">
        <h2 class="section-title">Mis boletos</h2>
        <div id="v-lista-boletos" class="lista-pendientes">
          <p class="no-data">Cargando...</p>
        </div>
      </div>

    </main>

    <!-- Modal: Inactividad -->
    <div id="inactividad-overlay" class="inactividad-overlay hidden"
      role="alertdialog" aria-modal="true" aria-labelledby="inactividad-titulo">
      <div class="inactividad-modal">
        <p class="inactividad-icon">⏱</p>
        <h2 id="inactividad-titulo" class="inactividad-titulo">¿Seguís ahí?</h2>
        <p class="inactividad-texto">
          Por seguridad, la sesión se cerrará en
          <strong id="inactividad-cuenta">60</strong> segundos por inactividad.
        </p>
        <button id="btn-mantener-sesion" class="btn-primary">Mantener sesión</button>
      </div>
    </div>

  </section>

  <script type="module" src="js/vendedor.js"></script>
</body>
</html>
