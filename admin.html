<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin — Rifa 2025</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Josefin+Sans:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- ── Sección de login ── -->
  <section id="login-section" class="login-section">
    <div class="login-card">
      <p class="login-pretitle">Panel Administrativo</p>
      <h1 class="login-title">Acceso Seguro</h1>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            required
            maxlength="254"
            placeholder="admin@ejemplo.com"
            autocomplete="email"
          >
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            required
            minlength="6"
            maxlength="128"
            placeholder="••••••••"
            autocomplete="current-password"
          >
        </div>
        <p class="login-error" id="login-error" role="alert"></p>
        <button type="submit" class="btn-primary">Ingresar</button>
      </form>

      <a href="index.html" class="back-link">← Volver al sorteo</a>
    </div>
  </section>

  <!-- ── Panel administrativo ── -->
  <section id="admin-section" class="admin-section hidden">

    <header class="admin-header">
      <div>
        <h1 class="admin-title">Panel Admin</h1>
        <p class="admin-subtitle">Rifa Digital 2025</p>
      </div>
      <div class="admin-header-right">
        <a href="index.html" class="btn-ghost" target="_blank">Ver grilla pública</a>
        <button id="logout-btn" class="btn-ghost danger">Cerrar sesión</button>
      </div>
    </header>

    <main class="admin-main">

      <!-- Stats -->
      <div class="admin-stats">
        <div class="admin-stat-card">
          <span class="admin-stat-value" id="stats-vendidos">—</span>
          <span class="admin-stat-label">Vendidos</span>
        </div>
        <div class="admin-stat-card">
          <span class="admin-stat-value" id="stats-disponibles">—</span>
          <span class="admin-stat-label">Disponibles</span>
        </div>
        <div class="admin-stat-card">
          <span class="admin-stat-value">2000</span>
          <span class="admin-stat-label">Total</span>
        </div>
      </div>

      <!-- Gestión de número -->
      <div class="admin-buscador">
        <h2 class="section-title">Gestionar número</h2>
        <input
          type="number"
          id="buscar-numero"
          class="buscar-input"
          placeholder="Ingresá un número del 1 al 2000"
          min="1"
          max="2000"
        >
        <div id="resultado-busqueda" class="resultado-busqueda"></div>
      </div>

    </main>
  </section>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
